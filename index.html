  .chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .card.rejected { opacity: 0.6; }
  .score { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center;
           font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--surface); }
  .title { font-weight: 600; font-size: 16px; color: var(--text); text-decoration: none; }
  .title:hover { color: var(--accent); }
  .new { background: var(--accent); color: var(--surface); font-size: 11px; font-weight: 700;
         border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

  .due-soon { color: var(--bad); font-weight: 600; }
  .reasons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

  .r.neg { background: var(--bad-soft); color: var(--bad); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
  code { font-size: 12px; background: var(--line); padding: 1px 5px; border-radius: 4px; }

</style>
</head>

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("radar:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("radar:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  q: "", new: store.get("new", false), online: store.get("online", false),
  sort: store.get("sort", false), all: store.get("all", false),
  hidden: new Set(store.get("hidden", [])),
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const inr = n => n >= 1e7 ? `₹${(n / 1e7).toFixed(1)} Cr` : n >= 1e5 ? `₹${(n / 1e5).toFixed(1)} L` : `₹${n.toLocaleString("en-IN")}`;
const daysLeft = d => d ? Math.ceil((new Date(d) - Date.now()) / 864e5) : null;
const scoreColor = s => s >= 70 ? "var(--s1)" : s >= 45 ? "var(--s2)" : "var(--s3)";

function render() {
  const evs = DATA.events;
  const good = evs.filter(e => !e.rejected);
  $("n-good").textContent = good.length;
  $("n-new").textContent = good.filter(e => e.new).length;
  $("n-all").textContent = evs.length;

  const q = state.q.toLowerCase();
  let rows = evs.filter(e =>
    (state.all || !e.rejected) &&
    (!state.new || e.new) &&
    (!state.online || e.online) &&
    !state.hidden.has(e.source) &&
    (!q || `${e.title} ${e.organiser} ${e.city} ${e.source}`.toLowerCase().includes(q)));
  if (state.sort) rows = [...rows].sort((a, b) => (daysLeft(a.deadline) ?? 1e9) - (daysLeft(b.deadline) ?? 1e9));

  $("list").innerHTML = rows.length ? rows.map(card).join("") :
    `<p class="empty">${state.new ? "Nothing new today. Check back tomorrow." : "No events match these filters."}</p>`;
}

function card(e) {
  const d = daysLeft(e.deadline);
  const due = d === null ? "no deadline listed" : d <= 0 ? "closes today" : `${d} day${d > 1 ? "s" : ""} left`;
  const meta = [
    esc(e.organiser || e.source), esc(e.source),
    `<span class="${d !== null && d <= 3 ? "due-soon" : ""}">${due}</span>`,
    e.online ? "Online" : esc(e.city || "In person"),
    e.prize ? inr(e.prize) + " prizes" : "",
    e.registrations ? e.registrations.toLocaleString("en-IN") + " registered" : "",
  ].filter(Boolean).map(x => `<span>${x}</span>`).join("");
  const reasons = e.reasons.map(r => {
    const neg = r.startsWith("-"), info = !/^[+-]/.test(r);
    return `<span class="r ${neg ? "neg" : info ? "info" : ""}">${esc(r)}</span>`;
  }).join("");
  return `<article class="card ${e.rejected ? "rejected" : ""}">
    <div class="score" style="background:${scoreColor(e.score)}" title="Score">${e.score}</div>
    <div>
      <a class="title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>${e.new ? '<span class="new">NEW</span>' : ""}
      <div class="meta">${meta}</div>
      <div class="reasons">${reasons}</div>
      ${e.rejected ? `<div class="why">Filtered out: ${esc(e.rejected)}</div>` : ""}
    </div>
  </article>`;
}

function toggle(id, key) {
  const btn = $(id);
  btn.setAttribute("aria-pressed", state[key]);
  btn.onclick = () => { state[key] = !state[key]; store.set(key, state[key]); btn.setAttribute("aria-pressed", state[key]); render(); };
}

function init() {
  const up = new Date(DATA.updated);
  const failed = Object.entries(DATA.sources).filter(([, n]) => n === null).map(([s]) => s);
  $("updated").textContent = `Updated ${up.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}`
    + (failed.length ? ` · couldn't reach ${failed.join(", ")}` : "");
  $("q").oninput = e => { state.q = e.target.value; render(); };
  toggle("f-new", "new"); toggle("f-online", "online"); toggle("f-sort", "sort"); toggle("f-all", "all");
  $("sources").innerHTML = Object.entries(DATA.sources).filter(([, n]) => n !== null).map(([s, n]) =>
    `<button class="chip" data-src="${s}" aria-pressed="${!state.hidden.has(s)}">${s} · ${n}</button>`).join("");
  $("sources").onclick = ev => {
    const b = ev.target.closest("[data-src]"); if (!b) return;
    const s = b.dataset.src;
    state.hidden.has(s) ? state.hidden.delete(s) : state.hidden.add(s);
    b.setAttribute("aria-pressed", !state.hidden.has(s));
    store.set("hidden", [...state.hidden]); render();
  };
  render();
}
init();
</script>
